<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&amp;family=Space+Grotesk:wght@700&amp;display=swap');
      
      .brand-title {
        font-family: 'Fraunces', Georgia, serif;
        font-size: 78px;
        font-weight: 700;
        fill: #124329;
        letter-spacing: 0.04em;
        text-anchor: middle;
      }
      .brand-sub {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 32px;
        font-weight: 700;
        fill: #124329;
        letter-spacing: 0.24em;
        text-anchor: middle;
      }
      .stroke-main {
        stroke: #124329;
        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .stroke-med {
        stroke: #124329;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .stroke-fine {
        stroke: #124329;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Background Paper -->
  <rect width="800" height="800" fill="#f7f2ea" />

  <!-- ==================== THE ARCH ==================== -->
  <path d="M 180 475 
           L 180 340 
           A 220 220 0 0 1 620 340 
           L 620 475 
           Z" 
        fill="#f37f94" 
        stroke="#124329" 
        stroke-width="16" 
        stroke-linejoin="round" />

  <!-- Ground Baseline -->
  <line x1="145" y1="475" x2="655" y2="475" stroke="#124329" stroke-width="16" stroke-linecap="round" />

  <!-- ==================== LEFT: GOOSENECK KETTLE ==================== -->
  <g id="kettle">
    <!-- Kettle Spout (swan neck curving up and nestling inside arch) -->
    <path d="M 260 415 
             C 210 405, 175 365, 185 295 
             C 188 275, 202 265, 214 270 
             C 206 277, 205 288, 204 300 
             C 200 340, 225 365, 265 375" 
          fill="#f7f2ea" 
          class="stroke-main" />

    <!-- Kettle Body (trapezoid) -->
    <path d="M 268 310 
             L 336 310 
             L 348 450 
             L 252 450 
             Z" 
          fill="#f7f2ea" 
          class="stroke-main" />

    <!-- Kettle Forest Green Base Band -->
    <path d="M 250 450 L 350 450 L 350 466 L 250 466 Z" fill="#124329" class="stroke-med" />

    <!-- Kettle Lid & Burnt Sienna Knob -->
    <path d="M 276 310 L 328 310 L 324 298 L 280 298 Z" fill="#f7f2ea" class="stroke-med" />
    <rect x="295" y="284" width="14" height="14" rx="3" fill="#ae5224" class="stroke-med" />

    <!-- Kettle Handle (loop on right side) -->
    <path d="M 336 325 C 368 330, 376 365, 368 400 C 362 425, 348 435, 344 435" 
          fill="none" 
          class="stroke-main" />
  </g>

  <!-- ==================== RIGHT: V60 DRIPPER & CARAFE ==================== -->
  <g id="v60">
    <!-- Glass Server / Mug -->
    <path d="M 488 415 
             L 572 415 
             L 562 466 
             L 498 466 
             Z" 
          fill="#f7f2ea" 
          class="stroke-main" />
    <!-- Fresh Brewed Coffee Liquid in Server -->
    <path d="M 493 430 L 567 430 L 560 463 L 500 463 Z" fill="#ae5224" />
    <!-- Server Handle -->
    <path d="M 570 420 C 596 420, 596 452, 564 456" fill="none" class="stroke-main" />

    <!-- Dripper Base Plate -->
    <rect x="475" y="402" width="110" height="15" rx="6" fill="#124329" class="stroke-med" />

    <!-- V60 Cone -->
    <path d="M 466 305 
             L 594 305 
             L 556 402 
             L 504 402 
             Z" 
          fill="#f7f2ea" 
          class="stroke-main" />

    <!-- V60 Spiral Rib Accents -->
    <path d="M 488 318 C 502 340, 514 370, 518 395" fill="none" class="stroke-fine" />
    <path d="M 530 318 C 535 340, 536 370, 532 395" fill="none" class="stroke-fine" />
    <path d="M 572 318 C 562 340, 554 370, 548 395" fill="none" class="stroke-fine" />

    <!-- V60 Cone Handle -->
    <path d="M 586 322 C 614 326, 618 358, 574 368" fill="none" class="stroke-main" />
  </g>

  <!-- ==================== CENTER: AEROPRESS ==================== -->
  <g id="aeropress">
    <!-- Top Plunger Cap / Handle (Forest Green) -->
    <rect x="352" y="152" width="96" height="26" rx="12" fill="#124329" class="stroke-main" />

    <!-- Plunger Shaft (White cylinder) -->
    <rect x="372" y="178" width="56" height="120" fill="#f7f2ea" class="stroke-main" />

    <!-- Rubber Plunger Seal Head -->
    <rect x="370" y="296" width="60" height="20" rx="4" fill="#124329" class="stroke-med" />

    <!-- Main Outer Chamber -->
    <rect x="360" y="240" width="80" height="185" rx="6" fill="#f7f2ea" class="stroke-main" />

    <!-- Rich Amber Coffee Liquid in Chamber -->
    <rect x="368" y="316" width="64" height="106" fill="#ae5224" />

    <!-- Hex Flanged Base Collar (Forest Green) -->
    <rect x="340" y="425" width="120" height="24" rx="10" fill="#124329" class="stroke-main" />

    <!-- Filter Cap at bottom -->
    <rect x="354" y="449" width="92" height="14" rx="5" fill="#124329" class="stroke-med" />

    <!-- Coffee Extract Drop -->
    <circle cx="400" cy="469" r="4.5" fill="#ae5224" />
  </g>

  <!-- ==================== BRAND TYPOGRAPHY ==================== -->
  <text x="400" y="582" class="brand-title">POURIN</text>
  <text x="400" y="646" class="brand-sub">WITH LOREN</text>

  <!-- Decorative Color Accents -->
  <circle cx="205" cy="635" r="7" fill="#f37f94" stroke="#124329" stroke-width="4" />
  <circle cx="595" cy="635" r="7" fill="#f37f94" stroke="#124329" stroke-width="4" />
</svg>
